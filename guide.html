<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Comprehensive guide and resources for learning Panel Attack, from beginner basics to expert techniques. Tutorials, strategies, and exercises for all skill levels." />
  <meta name="keywords" content="Panel Attack, guide, tutorial, strategy, combos, chains, defense, beginner, advanced, expert, tetris attack, puzzle league">
  <meta charset="utf-8" />
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Panel Attack - Guide</title>
  <link rel="shortcut icon" href="images/icon.png">
</head>

<body>
  <!-- SHARED HEADER - Loaded by header.js -->
  <script src="header.js"></script>
  <script src="clips.js"></script>
  <script src="guide/sections.js"></script>
  <script src="guide/glossary.js"></script>
  <script src="guide/howToPlay.js"></script>
  <script src="guide/lessons.js"></script>
  <script src="guide/references.js"></script>
  <script src="guide/achievements.js"></script>

  <div id="body" class="sidebar-layout">
    <nav class="unified-sidebar" aria-label="Guide contents">
      <div class="sidebar-header">
        <h3>Panel Attack Guide</h3>
      </div>
      <div id="guide-nav"></div>
    </nav>

    <main id="guide-content" class="main-content-area"></main>
  </div>

  <!-- FOOTER -->
  <div style="text-align: center; color: #888; font-size: 12px; padding: 20px;">
    <script>document.write("&copy; " + new Date().getFullYear() + " Panel Attack");</script>
  </div>

  <script>
    // How far down the window a heading has to reach before the sidebar calls it the one being read
    const READING_LINE = 150;
    const TOP_LEVEL = 10;

    function slug(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    // A tier is either a list of items, or entries that each get a link of their own under the tier
    // in the sidebar - a glossary category's terms, a skill level's fundamentals
    function entries(list, render) {
      return {entries: list, render};
    }

    function glossarySection(glossary) {
      const tiers = {};
      glossary.categories.forEach(category => { tiers[category.name] = entries(category.terms, glossaryTerm); });
      return {title: glossary.title, theme: glossary.theme, tiers};
    }

    // Each lesson's steps get links of their own; a step shows the clip of the glossary term it names
    function howToPlaySection(howToPlay, glossary) {
      const clips = {};
      glossary.categories.forEach(category => category.terms.forEach(term => { clips[term.id] = term; }));
      const controls = {title: 'Controls', html: `<img class="guide-controller" src="${howToPlay.controls.image}" alt="A controller: the directional pad moves the cursor, the two lower face buttons swap, the shoulder buttons raise, Start pauses">
          <p class="card-desc">${howToPlay.controls.keyboard}</p>`};
      const tiers = {'Introduction': [{description: howToPlay.intro}, controls]};
      howToPlay.lessons.forEach(lesson => {
        tiers[lesson.name] = entries(lesson.steps.map(step =>
          Object.assign({}, step, {id: `play-${step.id}`, clip: step.glossary ? clips[step.glossary] : step})), howToPlayStep);
      });
      return {title: howToPlay.title, theme: howToPlay.theme, tiers};
    }

    // A skill level: what to practice heads it, then its fundamentals, its lessons, the achievements
    // of its difficulty as goals, what comes next, its puzzles and its videos.
    // The unreliable frame tricks are left out of the goals; inserts are reliable enough to aim for.
    const UNRELIABLE_FRAME_TRICKS = ['perform-a-stealth', 'perform-a-catch', 'perform-a-slide', 'perform-a-tornado'];
    // The achievements catalog files a shogun under Frame Tricks, but it is a garbage chain
    const GOAL_CATEGORIES = {'perform-a-shogun': 'Garbage Chains'};
    function skillSection(sectionId, section, achievements) {
      const tiers = {};
      if (section.fundamentals) {
        tiers['Fundamentals'] = entries(section.fundamentals.map(fundamental =>
          Object.assign({id: slug(`${sectionId}-${fundamental.name}`), title: fundamental.name}, fundamental)), fundamentalEntry);
      }
      if (section.lessons) {
        tiers['Lessons'] = entries(section.lessons.map(lesson =>
          Object.assign({id: slug(`${sectionId}-${lesson.name}`), title: lesson.name}, lesson)), lessonEntry);
      }
      const goals = achievements
        .filter(achievement => achievement.difficulty === section.title && !UNRELIABLE_FRAME_TRICKS.includes(achievement.id))
        .map(achievement => Object.assign({}, achievement, {category: GOAL_CATEGORIES[achievement.id] || achievement.category}));
      if (goals.length) tiers['Goals'] = [goalsItem(goals)];
      if (section.nextTier) tiers['Ready for More'] = [{description: section.nextTier}];
      if (section.puzzles) tiers['Puzzles'] = [Object.assign({title: 'From Esme\'s Puzzle Guide'}, section.puzzles)];
      if (section.resources) tiers['Videos'] = [{links: section.resources}];
      return Object.assign({}, section, {tiers});
    }

    function navIcon(sectionId, section) {
      const icons = (section.badges || []).map(badge => `<img class="nav-badge" src="${badge}" alt="" width="20" height="20">`).join('');
      return icons || `<span class="nav-badge">${{glossary: '📚', 'how-to-play': '🎮', 'puzzle-guide': '🧩'}[sectionId] || '📋'}</span>`;
    }

    // clips.js loads a clip when it nears the screen; the file is twice the size it is shown at, so a
    // high density screen shows it pixel for pixel
    function guideClip(entry) {
      if (!entry || !entry.clip) return '';
      const size = entry.size ? ` width="${entry.size[0]}" height="${entry.size[1]}"` : '';
      return `<video class="guide-clip" data-src="${entry.image}"${size} preload="none" loop muted playsinline aria-label="${entry.title} clip"></video>`;
    }

    function bullets(list) {
      return list && list.length ? `<ul class="guide-list">${list.map(line =>
        typeof line === 'string' ? `<li>${line}</li>` : `<li>${line.text}${bullets(line.list)}</li>`).join('')}</ul>` : '';
    }

    function introCard(section) {
      const images = (section.badges || []).map(badge => `<img src="${badge}" alt="${section.title} Badge" class="face face--circle face--league">`).join('');
      // below the top level, a level is the least a player should be comfortable at
      const level = section.level < TOP_LEVEL ? `${section.level} minimum` : section.level;
      return `<div class="flexItem fullWidth card ${section.theme}">
          <div class="card-header">${images}<h2 class="card-name">${section.title}</h2></div>
          <p class="card-desc"><strong>Skill Range:</strong> ${section.skillRange} · <strong>Level:</strong> ${level}</p>
          <p class="card-desc">${section.focus}</p>
          ${bullets(section.practice)}
          ${section.alsoPracticeTitle ? `<p class="card-desc">${section.alsoPracticeTitle}</p>` : ''}
          ${bullets(section.alsoPractice)}
        </div>`;
    }

    function link(entry) {
      const outdated = entry.outdated ? ' <span class="guide-tag guide-tag--outdated">Outdated</span>' : '';
      return `<p class="card-desc">• <a href="${entry.url}" target="_blank">${entry.text}</a>${outdated}</p>`;
    }

    function tierItem(item) {
      return `<div class="tier-item">
          ${item.title ? `<h4>${item.title}</h4>` : ''}
          ${item.description ? `<p class="card-desc">${item.description}</p>` : ''}
          ${item.html || ''}
          ${(item.links || []).map(link).join('')}
        </div>`;
    }

    function goalsItem(goals) {
      const categories = [];
      goals.forEach(goal => {
        let category = categories.find(c => c.name === goal.category);
        if (!category) categories.push(category = {name: goal.category, goals: []});
        category.goals.push(goal);
      });
      const text = goal => goal.text.replace(/\b(APM|GPM)\b/gi, word => `<a href="#play-analytics">${word}</a>`) + (goal.online && goal.category !== 'Online' ? ' <span class="guide-tag">Online</span>' : '');
      return {html: categories.map(category => `<div class="goal-group">
          <h4>${category.name}</h4>
          ${bullets(category.goals.map(text))}
        </div>`).join('')};
    }

    function glossaryTerm(term) {
      return `<div class="guide-entry" id="${term.id}">
          <div class="guide-entry-content">
            <div class="guide-entry-header"><h5>${term.title}</h5></div>
            <p>${term.body}</p>
            ${term.reference ? referenceTable(term.reference) : ''}
            ${guideClip(term)}
          </div>
        </div>`;
    }

    function howToPlayStep(step) {
      return `<div class="guide-entry" id="${step.id}">
          <div class="guide-entry-content">
            <div class="guide-entry-header"><h5>${step.title}</h5></div>
            <p>${step.body}</p>
            ${step.picture ? `<img class="guide-controller guide-picture" src="${step.picture}" alt="${step.title}">` : ''}
            ${bullets(step.list)}
            ${step.reference ? referenceTable(step.reference) : guideClip(step.clip)}
          </div>
        </div>`;
    }

    // A garbage block's picture is drawn at a fixed size per panel, so blocks compare by width
    function garbageBlock([width, height]) {
      return `<img class="reference-garbage" src="images/guide/garbage/${width}x${height}.png" alt="${width} by ${height} garbage" style="width: calc(var(--garbage-panel) * ${width})">`;
    }

    function referenceTable(name) {
      const table = window.GUIDE_REFERENCES[name];
      const cards = row => `<div class="reference-attack">${row.attack.map(card => `<img class="reference-card" src="images/guide/cards/${card}.png" alt="${card.replace(/^combo0?/, '+').replace(/^chain0?/, 'x')}">`).join('')}`
        + (row.label ? `<span class="reference-label">${row.label}</span>` : '') + '</div>';
      const cells = row => [cards(row), `<div class="reference-blocks">${row.blocks.map(garbageBlock).join('')}</div>`]
        .concat(row.frames ? [row.frames, String(Number((row.frames / 60).toFixed(2)))] : []);
      return `<div class="reference-scroll"><table class="reference-table">
          <thead><tr>${table.columns.map(column => `<th>${column}</th>`).join('')}</tr></thead>
          <tbody>${table.rows.map(row => `<tr>${cells(row).map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>${table.note ? `<p>${table.note}</p>` : ''}`;
    }

    function lessonEntry(lesson) {
      const list = lesson.list ? `${lesson.listTitle ? `<p><strong>${lesson.listTitle}</strong></p>` : ''}${bullets(lesson.list)}` : '';
      return `<div class="guide-entry" id="${lesson.id}">
          <div class="guide-entry-content">
            <div class="guide-entry-header"><h5>${lesson.title}</h5></div>
            ${lesson.paragraphs.map(paragraph => `<p>${paragraph}</p>`).join('')}
            ${list}
            ${lessonExamples(lesson.name)}
          </div>
        </div>`;
    }

    function lessonExamples(name) {
      const lesson = window.GUIDE_LESSONS.lessons.find(candidate => candidate.name === name);
      if (!lesson) return '';
      // a pattern shown more than once plays its examples side by side under one title
      const groups = [];
      lesson.steps.forEach(step => {
        const last = groups[groups.length - 1];
        if (last && last[0].title === step.title && last[0].caption === step.caption) last.push(step);
        else groups.push([step]);
      });
      return groups.map(([first, ...rest]) => `<div class="lesson-example">
            <p><strong>${first.title}</strong></p>
            ${first.caption ? `<p>${first.caption}</p>` : ''}
            <div class="lesson-clips">${[first, ...rest].map(guideClip).join('')}</div>
          </div>`).join('');
    }

    function fundamentalEntry(fundamental) {
      const signs = fundamental.signs ? `<p class="guide-entry-label">Signs there's room for improvement</p>${bullets(fundamental.signs)}` : '';
      return `<div class="guide-entry" id="${fundamental.id}">
          <div class="guide-entry-content">
            <div class="guide-entry-header">
              <h5>${fundamental.title}</h5>
              <span class="guide-entry-kind">${fundamental.kind}</span>
              <span class="guide-entry-tags">${fundamental.tags.join(' · ')}</span>
            </div>
            ${[].concat(fundamental.body || 'Coming soon.').map(block => Array.isArray(block) ? bullets(block) : `<p>${block}</p>`).join('')}
            ${signs}
          </div>
        </div>`;
    }

    function renderGuide(sections) {
      const nav = [], content = [];
      Object.entries(sections).forEach(([sectionId, section]) => {
        const tierLinks = [], tierCards = [];
        Object.entries(section.tiers).forEach(([tierName, tier]) => {
          const tierId = slug(`${sectionId}-${tierName}`);
          const listed = Array.isArray(tier);
          if (!listed) {
            tierLinks.push(`<a class="tier-nav-item has-subtiers" href="#${tierId}">${tierName}</a>
              <div class="subtier-list">${tier.entries.map(entry => `<a class="subtier-nav-item" href="#${entry.id}">${entry.title}</a>`).join('')}</div>`);
          } else {
            tierLinks.push(`<a class="tier-nav-item" href="#${tierId}">${tierName}</a>`);
          }
          tierCards.push(`<div class="flexItem fullWidth card guide-tier ${section.theme}" id="${tierId}">
              <div class="card-header"><h3 class="card-name">${tierName}</h3></div>
              <div class="tier-content-main">${listed ? tier.map(tierItem).join('') : tier.entries.map(tier.render).join('')}</div>
            </div>`);
        });
        nav.push(`<div class="guide-nav-section">
            <a class="section-nav-item" href="#section-${sectionId}">
              <span class="section-nav-title">${navIcon(sectionId, section)}<strong>${section.title}</strong></span>
              <span class="section-expand-arrow" aria-hidden="true">▶</span>
            </a>
            <div class="tier-list">${tierLinks.join('')}</div>
          </div>`);
        content.push(`<section class="guide-section" id="section-${sectionId}">
            ${section.skillRange ? introCard(section) : ''}
            ${tierCards.join('')}
          </section>`);
      });
      document.getElementById('guide-nav').innerHTML = nav.join('');
      document.getElementById('guide-content').innerHTML = content.join('');
    }

    // Links the first mention of each glossary term in every entry and card to its definition,
    // longest terms first so "Garbage Chain" wins over "Chain". A term never links inside its own
    // entry, a heading, an existing link or a .no-glossary span, for a word used in its everyday sense.
    function linkGlossaryTerms(root, glossary) {
      const terms = glossary.categories.flatMap(category => category.terms).map(term => ({
        id: term.id,
        name: term.title.replace(/\s*\(.*\)$/, ''),
      })).sort((a, b) => b.name.length - a.name.length);
      const escape = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const pattern = new RegExp(`\\b(${terms.map(term => escape(term.name)).join('|')})(?:s|es|ing|ed|d)?\\b`, 'gi');
      const termFor = word => terms.find(term => word.toLowerCase().startsWith(term.name.toLowerCase())
        && (term.name !== term.name.toUpperCase() || word.startsWith(term.name)));
      const skip = 'a, h1, h2, h3, h4, h5, h6, .guide-entry-kind, .guide-entry-tags, .guide-entry-label, .guide-tag, .no-glossary';

      const containers = '.guide-entry, .tier-item, .card';
      root.querySelectorAll(containers).forEach(container => {
        const linked = new Set([container.id]);
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
          acceptNode: node => node.parentElement.closest(skip) || node.parentElement.closest(containers) !== container
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => {
          const text = node.textContent;
          const pieces = [];
          let last = 0;
          for (const {0: word, index} of text.matchAll(pattern)) {
            const term = termFor(word);
            if (!term || linked.has(term.id)) continue;
            linked.add(term.id);
            pieces.push(document.createTextNode(text.slice(last, index)));
            const link = document.createElement('a');
            link.href = `#${term.id}`;
            link.className = 'glossary-link';
            link.textContent = word;
            pieces.push(link);
            last = index + word.length;
          }
          if (!pieces.length) return;
          pieces.push(document.createTextNode(text.slice(last)));
          node.replaceWith(...pieces);
        });
      });
    }

    function navLink(id) {
      return id && document.querySelector(`#guide-nav a[href="#${CSS.escape(id)}"]`);
    }

    // Opens the section, and the tier, holding what is being read, and lights it
    function showInNav(sectionId, tierId, termId) {
      document.querySelectorAll('#guide-nav .active, #guide-nav .expanded').forEach(e => e.classList.remove('active', 'expanded'));
      const sectionLink = navLink(sectionId);
      if (sectionLink) {
        sectionLink.classList.add('expanded');
        sectionLink.nextElementSibling.classList.add('expanded');
      }
      const tierLink = navLink(tierId);
      if (tierLink) {
        tierLink.classList.add('active');
        if (tierLink.classList.contains('has-subtiers')) {
          tierLink.classList.add('expanded');
          tierLink.nextElementSibling.classList.add('expanded');
        }
      }
      const termLink = navLink(termId);
      if (termLink) termLink.classList.add('active');
    }

    // The section, tier and term an element sits in, itself included
    function placeOf(element) {
      const within = selector => element && element.closest(selector);
      return [within('.guide-section'), within('.guide-tier'), within('.guide-entry')].map(e => e && e.id);
    }

    // The last of these, in page order, whose top has reached the reading line
    function lastReached(elements) {
      let reached = null;
      for (const element of elements) {
        if (element.getBoundingClientRect().top > READING_LINE) break;
        reached = element;
      }
      return reached;
    }

    // While the page scrolls to a link that was clicked, the sidebar keeps showing that link rather
    // than everything scrolled past on the way - and a link near the bottom of the page, whose
    // heading can never reach the reading line, stays lit. Scrolling by hand hands it back.
    let followingLink = false;

    function followScroll() {
      if (followingLink) return;
      const content = document.getElementById('guide-content');
      const section = lastReached(content.querySelectorAll('.guide-section')) || content.querySelector('.guide-section');
      const tier = lastReached(section.querySelectorAll('.guide-tier'));
      const term = tier && lastReached(tier.querySelectorAll('.guide-entry'));
      showInNav(section.id, tier && tier.id, term && term.id);
    }

    function goTo(id, behavior) {
      const target = document.getElementById(id);
      if (!target) return;
      followingLink = true;
      showInNav(...placeOf(target));
      target.scrollIntoView({behavior, block: 'start'});
    }

    function initGuide() {
      const sections = {};
      Object.entries(window.GUIDE_SECTIONS).forEach(([sectionId, section]) => {
        sections[sectionId] = section.level ? skillSection(sectionId, section, window.ACHIEVEMENTS.achievements) : section;
        if (sectionId === 'overview') sections['how-to-play'] = howToPlaySection(window.HOW_TO_PLAY, window.GLOSSARY);
      });
      sections.glossary = glossarySection(window.GLOSSARY);
      sections['puzzle-guide'] = window.PUZZLE_GUIDE;
      renderGuide(sections);
      linkGlossaryTerms(document.getElementById('guide-content'), window.GLOSSARY);
      watchClips(document.getElementById('guide-content'));

      document.getElementById('guide-nav').addEventListener('click', event => {
        const link = event.target.closest('a[href^="#"]');
        if (!link || event.metaKey || event.ctrlKey || event.shiftKey) return;
        event.preventDefault();
        history.replaceState(null, '', link.getAttribute('href'));
        goTo(link.getAttribute('href').slice(1), 'smooth');
      });
      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(type =>
        window.addEventListener(type, event => {
          if (!event.target.closest || !event.target.closest('#guide-nav')) followingLink = false;
        }, {passive: true}));

      let queued = false;
      window.addEventListener('scroll', () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; followScroll(); });
      }, {passive: true});

      // the content is written after the browser looked for the address's anchor, so go to it now
      if (location.hash) {
        goTo(decodeURIComponent(location.hash.slice(1)), 'instant');
      } else {
        followScroll();
      }
    }

    document.addEventListener('DOMContentLoaded', initGuide);
  </script>
</body>

</html>
