<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Attack Glossary</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --fg: #f0f0f3;
      --muted: #cfd0d6;
      --link: #7fd0ff;
      --maxw: 1200px;
      --cardw: 420px;
    }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Noto Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: clamp(16px, 4vw, 28px);
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 600;
      font-size: clamp(36px, 6vw, 56px);
      margin: 0 0 6px 0;
    }
    header p { color: var(--muted); margin: 0 0 18px 0; }
    nav.toc {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 24px;
      background: rgba(255,255,255,.02);
    }
    nav.toc h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      margin: 0 0 8px 0;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    nav.toc a {
      color: var(--link);
      text-decoration: none;
      margin-right: 10px;
      line-height: 1.9;
      white-space: nowrap;
    }
    nav.toc a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--cardw)), 1fr));
      gap: 24px;
    }
    .card {
      text-align: center;
      padding: clamp(14px, 3vw, 22px);
      border-radius: 16px;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.08);
    }
    .card h3 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(40px, 8vw, 60px);
      letter-spacing: .05em;
      line-height: .9;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }
    .card p {
      color: var(--muted);
      margin: 0 auto 16px auto;
      max-width: 62ch;
      font-size: 16px;
      line-height: 1.55;
    }
    .diagram {
      display: inline-block;
      image-rendering: pixelated;
      width: clamp(90px, 33vw, 200px);
      height: auto;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 8px 22px rgba(0,0,0,.35));
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        linear-gradient(transparent 95%, rgba(255,255,255,0.05) 95%) 0 0/ 28px 28px,
        linear-gradient(90deg, transparent 95%, rgba(255,255,255,0.05) 95%) 0 0/ 28px 28px;
      opacity: .06;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Panel Attack – Glossary</h1>
      <p>Auto-generated from the glossary cards. Headings use <strong>Oswald</strong> and body text uses <strong>Noto Sans</strong>.</p>
    </header>
    <nav class="toc" aria-label="Glossary table of contents">
      <h2>Table of Contents</h2>
      <div id="toc-links"></div>
    </nav>
    <section class="grid" id="cards"></section>
  </div>

  <script>
    const GLOSSARY = [{"id": "catch", "title": "Catch", "body": "Swapping a falling panel into an adjacent column, requiring frame-perfect timing. A type of skill chain.", "diagram": "catch_diagram.png"}, {"id": "chain", "title": "Chain", "body": "When panels fall after a match disappears, causing another match. Denoted as x2 for a 2 chain, x3 for a 3 chain, etc. Referred to as “skill chains” when panels are actively swapped to extend the chain. Chains above x13 are referred to as “mystery chains” due to the game denoting them as “x?”.", "diagram": "chain_diagram.png"}, {"id": "clear", "title": "Clear", "body": "When panels are matched next to garbage blocks, turning the garbage into panels.", "diagram": "clear_diagram.png"}, {"id": "combo", "title": "Combo", "body": "A match of more than three panels at the same time. Denoted as +4 for a 4 combo, +5 for a 5 combo, etc.", "diagram": "combo_diagram.png"}, {"id": "combo-storm", "title": "Combo Storm", "body": "Performing many combos in rapid succession to send many small garbage pieces, resulting in low shake time for your opponent; can kill very quickly.", "diagram": "combo-storm_diagram.png"}, {"id": "das", "title": "DAS", "body": "“Delayed Auto Shift” — Rapidly moving your cursor across the board by holding down a movement key.", "diagram": "das_diagram.png"}, {"id": "downstacking", "title": "Downstacking", "body": "Removing panels from towers (or the highest points of your stack) to reduce its height.", "diagram": "downstacking_diagram.png"}, {"id": "factory", "title": "Factory", "body": "Rapidly sending many x3 chains to your opponent, resulting in a garbage pattern that is very difficult to clear.", "diagram": "factory_diagram.png"}, {"id": "frame-trick", "title": "Frame Trick", "body": "Any skill chain that requires frame-perfect timing to execute (e.g. slide, catch).", "diagram": "frame-trick_diagram.png"}, {"id": "garbage-chain", "title": "Garbage Chain", "body": "When panels fall from cleared garbage and cause a chain or combo.", "diagram": "garbage-chain_diagram.png"}, {"id": "ghost-match", "title": "Ghost Match", "body": "When rising panels become active and form a match. Can also be a ghost combo if multiple matches are made.", "diagram": "ghost-match_diagram.png"}, {"id": "insert", "title": "Insert", "body": "Swapping a panel into the space between a falling panel and the panel beneath it. A type of skill chain.", "diagram": "insert_diagram.png"}, {"id": "locked-out", "title": "Locked Out", "body": "When you are topped out with no possible moves to make.", "diagram": "locked-out_diagram.png"}, {"id": "shake-time", "title": "Shake Time", "body": "The period of time after garbage falls on your stack, causing it to shake. Larger garbage results in more shake time. You cannot lose during shake time, even if you are topped out.", "diagram": "shake-time_diagram.png"}, {"id": "shogun", "title": "Shogun", "body": "When a panel from a higher tier falls and creates a chain after the garbage beneath it is cleared.", "diagram": "shogun_diagram.png"}, {"id": "slide", "title": "Slide", "body": "Swapping a panel underneath a falling panel so it supports two panels at once, requiring frame-perfect timing. A type of skill chain.", "diagram": "slide_diagram.png"}, {"id": "stealth", "title": "Stealth", "body": "Swapping a piece over two spaces by quickly pressing both swap buttons while moving in the direction you want to swap the panel. Can be used to move a panel past a match, or extend the length of a catch (also called a stealth chain).", "diagram": "stealth_diagram.png"}, {"id": "stop-time", "title": "Stop Time", "body": "The period of time after making a chain or combo when your panels stop rising. Larger chains and combos result in more stop time. Less stop time is given on higher difficulty levels; more stop time is given if you are nearly topped out. You cannot lose during stop time, even if you are topped out.", "diagram": "stop-time_diagram.png"}, {"id": "tier", "title": "Tier", "body": "Layers of panels above or between garbage.", "diagram": "tier_diagram.png"}, {"id": "time-delay", "title": "Time Delay", "body": "When falling panels land at slightly different times and form multiple chains instead of a single chain/combo.", "diagram": "time-delay_diagram.png"}, {"id": "topped-out", "title": "Topped Out", "body": "When panels and/or garbage reach the top of your playfield. Being topped out for too long results in defeat.", "diagram": "topped-out_diagram.png"}, {"id": "tornado", "title": "Tornado", "body": "Quickly swapping two panels into the space left from a vertical match to create a chain.", "diagram": "tornado_diagram.png"}, {"id": "tower", "title": "Tower", "body": "A tall, isolated column of panels. Very dangerous; holds garbage up high, often prevents clears, and inhibits how high you can raise your stack.", "diagram": "tower_diagram.png"}, {"id": "transition-clear", "title": "Transition Clear", "body": "Aligning three panels as shown below to easily “transition” from one layer of garbage to the next.", "diagram": "transition-clear_diagram.png"}];

    // Build TOC
    const toc = document.getElementById('toc-links');
    GLOSSARY.forEach(item => {
      const a = document.createElement('a');
      a.href = '#' + item.id;
      a.textContent = item.title;
      toc.appendChild(a);
    });

    // Render cards
    const cards = document.getElementById('cards');
    GLOSSARY.forEach(item => {
      const el = document.createElement('article');
      el.className = 'card';
      el.id = item.id;
      el.innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.body}</p>
        <img class="diagram" src="./${item.diagram}" alt="${item.title} diagram">
      `;
      cards.appendChild(el);
    });
  </script>
</body>
</html>
